<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta bb.business</title>
    <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, white,#006000);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0px 4px 20px #006000;
      width: 300px;
      text-align: center;
    }
    .container h2 {
      margin-bottom: 20px;
      color: #006000;
    }
   
    .container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #006000;
      border-radius: 8px;
      outline: none;
    }
    .container button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #006000;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .container button:hover {
      background: #006000;
    }
    .container a {
      display: block;
      margin-top: 12px;
      color: #006000;
      text-decoration: none;
      font-size: 14px;
    }
    .container a:hover {
      text-decoration: underline;
    }
  </style>

</head>
<body>

<div class="container">
    <h2>Criar Conta</h2>
    <form id="formCriarConta">
      <input type="text" id="nome" placeholder="Nome completo" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="number" id="numero" placeholder="Número de Telefone" required>
      <input type="password" id="senha" placeholder="Senha" required>
     <button onclick="window.location.href='perfil.html'">Criar conta </button>
    </form>
    <p>Já tens conta? <a href="login.html">Entrar</a></p>
  </div>

  

</body>
</html>
