<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação da Compra — bb.business</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #006000;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin: 0;
    }

    .confirmacao {
      background-color: white;
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      text-align: center;
    }

    .confirmacao h2 {
      color: #006000;
      margin-bottom: 20px;
    }

    .confirmacao p {
      font-size: 16px;
      margin: 10px 0;
    }

    .confirmacao .check {
      font-size: 60px;
      color: #006000;
      margin-bottom: 10px;
    }

    .btns {
      margin-top: 25px;
    }

    .btns button {
      background-color: #006000;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 15px;
    }

    .btns button:hover {
      background-color: #004d00;
    }
  </style>
</head>
<body>

  <header>
    <h1>bb.business</h1>
  </header>

  <div class="confirmacao">
    <div class="check">✔️</div>
    <h2>Compra Confirmada!</h2>
    <p><strong>Obrigado pela sua compra.</strong></p>
    <p>Seu pedido foi registrado com sucesso.</p>
    <p><strong>Valor total:</strong> KZ 1.025.000<span id="totalCompra"></span></p>
    <p><strong>Forma de pagamento:</strong> Pagar no ato da entrega 💵</p>
    <p>Em breve você receberá uma confirmação pelo WhatsApp ou e-mail cadastrado.</p>
    

    <div class="btns">
      <button onclick="window.location.href='tela inicial.html'">Voltar à Loja</button>
      <button onclick="window.location.href='perfil.html'">Ver Perfil</button>
    </div>
  </div>
</body>
</html>
