    /* ======= MENU DE NAVEGAÇÃO SUPERIOR ======= */  
nav ul {  
  list-style: none;  
  margin: 15px 0;  
  padding: 0;  
  display: flex;  
  justify-content: center;  
  gap: 20px;  
  background-color: #006000; /* fundo verde */  
  color: white; /* texto branco */  
}  

nav ul li {  
  display: inline-block;  
  font-weight: bold;  
  color: white; /* garante que os itens fiquem brancos */  
}  

nav ul li a {  
  color: white; /* links brancos */  
  text-decoration: none;  
  font-weight: bold;  
  transition: color 0.3s;  
}  

nav ul li a:hover {  
  color: black; /* verde escuro ao passar o mouse */  
  text-decoration: underline;  
}

    /* ======= BANNER ======= */
    .banner {
      background-color: ;

      font-size: 20px;

    }

    /* ======= CATEGORIAS ======= */
    .categorias {
      display: flex;
      justify-content: space-around;
      padding: 20px;
      background-color: #fff;
    }

    .categorias div {
      text-align: center;
    }

    .categorias img {
      border-radius: 10px;
      width: 100px;
      height: 100px;
    }

    /* ======= PRODUTOS ======= */
    .produtos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 250px;
      text-align: center;
      padding: 15px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .card p {
      color: #777;
    }

    .card button {
      background-color: #006000;
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .card button:hover {
      background-color: #006000;
    }

   
    /* ======= MENU INFERIOR ======= */  
.bottom-nav {  
  display: flex;  
  justify-content: space-around;  
  align-items: center;  
  background-color: #fff;  
  border-top: 2px solid #006000;  
  padding: 10px 0;  
  position: fixed;  
  bottom: 0;  
  width: 100%;  
  z-index: 10;  
}

.bottom-nav a {  
  display: flex;  
  flex-direction: column;  
  align-items: center;  
  font-size: 14px;  
  text-decoration: none;  
  color: #333;  
  transition: 0.3s;  
}

.bottom-nav a i {  
  font-size: 20px;  
  margin-bottom: 4px;  
}

.bottom-nav a:hover {  
  color: #006000;  
  transform: scale(1.1); /* pequeno destaque ao passar o mouse */
}

.bottom-nav a.ativo {  
  color: #006000;  
  font-weight: bold;  
}
    
</style>
